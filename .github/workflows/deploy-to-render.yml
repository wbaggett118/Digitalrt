name: Deploy to Render

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build and Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Optional build (if present)
        run: npm run build --if-present

      - name: Install jq (used for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger Render deploy (create/find service if needed)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "ERROR: RENDER_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Triggering deploy for existing service: $RENDER_SERVICE_ID"
            curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' | jq .
            exit 0
          fi

          echo "RENDER_SERVICE_ID not provided — searching for a service named 'Digitalrt'..."
          SERVICES_JSON=$(curl -s -X GET "https://api.render.com/v1/services" -H "Authorization: Bearer $RENDER_API_KEY")
          SERVICE_ID=$(echo "$SERVICES_JSON" | jq -r '.[] | select(.name=="Digitalrt") | .id' || true)

          if [ -n "$SERVICE_ID" ] && [ "$SERVICE_ID" != "null" ]; then
            echo "Found service: $SERVICE_ID. Triggering deploy."
            curl -s -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' | jq .
            exit 0
          fi

          echo "Service not found. Creating a new web service on Render with the repo and render.yaml settings..."
          CREATE_PAYLOAD=$(jq -n \
            --arg name "Digitalrt" \
            --arg repo "https://github.com/wbaggett118/Digitalrt" \
            --arg branch "main" \
            '{serviceType: "web", name: $name, repo: $repo, env: "node", branch: $branch, plan: "free", autoDeploy: true, buildCommand: "npm install", startCommand: "npm start"}')

          echo "$CREATE_PAYLOAD" | jq . > /tmp/render_create_payload.json

          CREATE_RESP=$(curl -s -X POST "https://api.render.com/v1/services" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/render_create_payload.json)

          echo "$CREATE_RESP" | jq . > /tmp/render_create_response.json
          NEW_ID=$(jq -r '.id // empty' /tmp/render_create_response.y //| true)

          if [ -n "$NEW_ID" ]; then
            echo "Created service $NEW_ID. Triggering first deploy..."
            curl -s -X POST "https://api.render.com/v1/services/$NEW_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' | jq .
            exit 0
          else
            echo "Failed to create Render service. Response:" 
            cat /tmp/y'yaml.json,service triggering /deploys"\
            exit 1
          fi
